<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資料比對工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1c2024;
    --paper:#fbfaf8;
    --line:#dcd7cc;
    --line-soft:#eae6dc;
    --accent:#2f5d50;
    --accent-soft:#e4ece8;
    --warn:#9a4a3a;
    --warn-soft:#f3e6e2;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;padding:32px 20px 80px;}
  .wrap{max-width:920px;margin:0 auto;}
  header{margin-bottom:28px;border-bottom:2px solid var(--ink);padding-bottom:16px;}
  header .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
  h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em;}
  header p{margin:0;color:#5b5750;font-size:14px;}

  .step{border:1px solid var(--line);background:#fff;border-radius:10px;padding:20px 22px;margin-bottom:18px;}
  .step-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
  .step-num{font-family:var(--mono);font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex:none;}
  .step-head h2{font-size:16px;margin:0;}
  .step-head .sub{font-size:12.5px;color:#84806f;margin-left:auto;font-family:var(--mono);}

  .drop{border:1.5px dashed var(--line);border-radius:8px;padding:22px;text-align:center;cursor:pointer;transition:.15s border-color,.15s background;background:#fdfcfa;}
  .drop:hover,.drop.drag{border-color:var(--accent);background:var(--accent-soft);}
  .drop input{display:none;}
  .drop .hint{font-size:13px;color:#8a8577;}
  .drop .fname{font-family:var(--mono);font-size:13.5px;color:var(--ink);margin-top:4px;word-break:break-all;}

  .filegrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:640px){.filegrid{grid-template-columns:1fr;}}

  .meta{margin-top:12px;font-size:12.5px;color:#5b5750;display:none;}
  .meta.show{display:block;}
  .meta table{width:100%;border-collapse:collapse;margin-top:6px;}
  .meta td{padding:3px 0;vertical-align:top;}
  .meta td:first-child{color:#8a8577;width:78px;flex:none;}
  select{font-family:var(--mono);font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);max-width:100%;}

  button.primary{font-family:var(--sans);font-weight:600;font-size:14.5px;color:#fff;background:var(--ink);border:none;border-radius:7px;padding:12px 22px;cursor:pointer;transition:.15s opacity,.15s transform;}
  button.primary:hover{opacity:.88;}
  button.primary:active{transform:translateY(1px);}
  button.primary:disabled{background:#c9c5ba;cursor:not-allowed;}
  button.ghost{font-family:var(--mono);font-size:12.5px;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:6px;padding:8px 14px;cursor:pointer;}
  button.ghost:hover{background:var(--accent-soft);}

  .status{font-family:var(--mono);font-size:12.5px;color:#8a8577;margin-top:12px;min-height:16px;}
  .status.err{color:var(--warn);}

  .progress{height:4px;background:var(--line-soft);border-radius:2px;overflow:hidden;margin-top:12px;display:none;}
  .progress.show{display:block;}
  .progress > div{height:100%;width:0%;background:var(--accent);transition:.15s width;}

  .results{display:none;}
  .results.show{display:block;}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
  .stat{border:1px solid var(--line-soft);border-radius:8px;padding:14px 16px;background:#fdfcfa;}
  .stat .num{font-family:var(--mono);font-size:22px;font-weight:600;}
  .stat .lbl{font-size:12px;color:#8a8577;margin-top:2px;}
  .stat.hit .num{color:var(--accent);}
  .stat.miss .num{color:var(--warn);}

  table.preview{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono);display:block;overflow-x:auto;white-space:nowrap;border:1px solid var(--line-soft);border-radius:6px;}
  table.preview th, table.preview td{padding:7px 10px;border-bottom:1px solid var(--line-soft);text-align:left;}
  table.preview th{background:#f5f2ea;position:sticky;top:0;}
  table.preview tr:last-child td{border-bottom:none;}
  .tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;}
  .tag.y{background:var(--accent-soft);color:var(--accent);}
  .tag.n{background:var(--warn-soft);color:var(--warn);}

  .preview-wrap{margin-top:18px;}
  .preview-wrap .cap{font-size:12px;color:#8a8577;margin-bottom:6px;}

  footer{margin-top:36px;font-size:12px;color:#a19c8d;text-align:center;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">本機比對工具 · 資料不會上傳到任何伺服器</div>
    <h1>資料比對工具</h1>
    <p>上傳兩份 Excel，選擇任一共同欄位當作比對依據（例如訂單號碼、會員編號…），自動比對並輸出標記成功/失敗的結果。</p>
  </header>

  <!-- STEP 1 -->
  <div class="step">
    <div class="step-head">
      <div class="step-num">1</div>
      <h2>上傳兩份 Excel</h2>
    </div>
    <div class="filegrid">
      <div>
        <div class="drop" id="drop-a">
          <input type="file" id="file-a" accept=".xlsx,.xls">
          <div class="hint">資料表 A（主表，比對結果以此為主）</div>
          <div class="fname" id="fname-a"></div>
        </div>
        <div class="meta" id="meta-a">
          <table>
            <tr><td>筆數</td><td id="meta-a-rows">—</td></tr>
            <tr><td>比對欄位</td><td><select id="col-a"></select></td></tr>
          </table>
        </div>
      </div>
      <div>
        <div class="drop" id="drop-b">
          <input type="file" id="file-b" accept=".xlsx,.xls">
          <div class="hint">資料表 B（用來比對 A 的資料）</div>
          <div class="fname" id="fname-b"></div>
        </div>
        <div class="meta" id="meta-b">
          <table>
            <tr><td>筆數</td><td id="meta-b-rows">—</td></tr>
            <tr><td>比對欄位</td><td><select id="col-b"></select></td></tr>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- STEP 2 -->
  <div class="step">
    <div class="step-head">
      <div class="step-num">2</div>
      <h2>執行比對</h2>
      <div class="sub" id="ready-hint">請先完成上傳</div>
    </div>
    <button class="primary" id="run-btn" disabled>開始比對</button>
    <div class="progress" id="progress"><div id="progress-bar"></div></div>
    <div class="status" id="status"></div>
  </div>

  <!-- STEP 3 -->
  <div class="step results" id="results-step">
    <div class="step-head">
      <div class="step-num">3</div>
      <h2>比對結果</h2>
    </div>

    <div class="stat-row">
      <div class="stat"><div class="num" id="stat-total">—</div><div class="lbl">A 表總筆數</div></div>
      <div class="stat hit"><div class="num" id="stat-hit">—</div><div class="lbl">比對成功</div></div>
      <div class="stat miss"><div class="num" id="stat-miss">—</div><div class="lbl">比對失敗</div></div>
    </div>

    <button class="ghost" id="download-btn">下載比對結果 Excel</button>

    <div class="preview-wrap">
      <div class="cap">預覽前 15 筆結果：</div>
      <table class="preview" id="preview-table"></table>
    </div>
  </div>

  <footer>以你在上方選擇的欄位為主鍵，將資料表 B 中所有相符紀錄彙總串接到資料表 A。</footer>
</div>

<script>
(function(){
  const state = {
    a: null,      // {headers, rows}
    b: null,
    keyColA: null,
    keyColB: null,
    result: null
  };

  // ---------- helpers ----------
  function normKey(v){
    if(v === null || v === undefined) return '';
    if(typeof v === 'number'){
      if(Number.isFinite(v)) return String(Math.round(v));
      return '';
    }
    let s = String(v).trim();
    if(s === '') return '';
    s = s.replace(/\.0+$/,'');
    return s;
  }

  function scoreHeader(h){
    // higher score = more likely to be a join key
    if(h === '訂單號碼' || h === '會員編號') return 100;
    if(h.includes('會員') && h.includes('編號')) return 90;
    if(h.includes('訂單') && h.includes('號碼')) return 90;
    if(h.includes('訂單編號')) return 85;
    if(h.includes('會員')) return 60;
    if(h.includes('訂單')) return 60;
    if(h.includes('編號') || h.includes('ID') || h.includes('Id')) return 40;
    return 0;
  }

  function guessKeyColumns(headersA, headersB){
    // 1) prefer an exact common column name between both files
    const common = headersA.find(h => headersB.includes(h));
    if(common){
      // if multiple common columns exist, pick the highest-scoring one
      const commons = headersA.filter(h => headersB.includes(h));
      commons.sort((x,y)=> scoreHeader(y) - scoreHeader(x));
      return {a: commons[0], b: commons[0]};
    }
    // 2) otherwise guess independently by keyword score
    const bestA = [...headersA].sort((x,y)=>scoreHeader(y)-scoreHeader(x))[0];
    const bestB = [...headersB].sort((x,y)=>scoreHeader(y)-scoreHeader(x))[0];
    return {a: bestA, b: bestB};
  }

  function readWorkbook(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try{
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, {type:'array', cellDates:true});
          const sheetName = wb.SheetNames[0];
          const ws = wb.Sheets[sheetName];
          const json = XLSX.utils.sheet_to_json(ws, {defval:'', raw:true});
          const headers = json.length ? Object.keys(json[0]) : (XLSX.utils.sheet_to_json(ws,{header:1})[0]||[]);
          resolve({headers, rows: json, sheetName});
        }catch(err){ reject(err); }
      };
      reader.onerror = () => reject(new Error('讀取檔案失敗'));
      reader.readAsArrayBuffer(file);
    });
  }

  function fmtCell(v){
    if(v instanceof Date){
      const pad = n => String(n).padStart(2,'0');
      return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
    }
    return v;
  }

  function populateSelect(sel, headers, guessed){
    sel.innerHTML = '';
    headers.forEach(h => {
      const opt = document.createElement('option');
      opt.value = h; opt.textContent = h;
      if(h === guessed) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  function setStatus(msg, isErr){
    const el = document.getElementById('status');
    el.textContent = msg;
    el.classList.toggle('err', !!isErr);
  }

  function checkReady(){
    const ready = state.a && state.b;
    document.getElementById('run-btn').disabled = !ready;
    document.getElementById('ready-hint').textContent = ready ? '已就緒，可以開始比對' : '請先完成上傳';
  }

  function reguessIfBothLoaded(){
    if(state.a && state.b){
      const g = guessKeyColumns(state.a.headers, state.b.headers);
      const selA = document.getElementById('col-a');
      const selB = document.getElementById('col-b');
      selA.value = g.a; state.keyColA = g.a;
      selB.value = g.b; state.keyColB = g.b;
    }
  }

  // ---------- file wiring ----------
  function wireDrop(dropId, inputId, onFile){
    const drop = document.getElementById(dropId);
    const input = document.getElementById(inputId);
    drop.addEventListener('click', () => input.click());
    input.addEventListener('change', () => { if(input.files[0]) onFile(input.files[0]); });
    ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
    ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
    drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if(f) onFile(f); });
  }

  wireDrop('drop-a','file-a', async (file) => {
    document.getElementById('fname-a').textContent = file.name;
    setStatus('讀取資料表 A 中…');
    try{
      const parsed = await readWorkbook(file);
      state.a = parsed;
      document.getElementById('meta-a-rows').textContent = parsed.rows.length.toLocaleString();
      const sel = document.getElementById('col-a');
      populateSelect(sel, parsed.headers, guessKeyColumns(parsed.headers, state.b ? state.b.headers : []).a);
      sel.onchange = () => { state.keyColA = sel.value; };
      state.keyColA = sel.value;
      document.getElementById('meta-a').classList.add('show');
      reguessIfBothLoaded();
      setStatus('');
    }catch(err){ setStatus('讀取資料表 A 失敗：'+err.message, true); }
    checkReady();
  });

  wireDrop('drop-b','file-b', async (file) => {
    document.getElementById('fname-b').textContent = file.name;
    setStatus('讀取資料表 B 中…');
    try{
      const parsed = await readWorkbook(file);
      state.b = parsed;
      document.getElementById('meta-b-rows').textContent = parsed.rows.length.toLocaleString();
      const sel = document.getElementById('col-b');
      populateSelect(sel, parsed.headers, guessKeyColumns(state.a ? state.a.headers : [], parsed.headers).b);
      sel.onchange = () => { state.keyColB = sel.value; };
      state.keyColB = sel.value;
      document.getElementById('meta-b').classList.add('show');
      reguessIfBothLoaded();
      setStatus('');
    }catch(err){ setStatus('讀取資料表 B 失敗：'+err.message, true); }
    checkReady();
  });

  // ---------- matching ----------
  function runMatch(){
    const progress = document.getElementById('progress');
    const bar = document.getElementById('progress-bar');
    progress.classList.add('show');
    bar.style.width = '10%';
    setStatus('建立索引中…');

    setTimeout(() => {
      try{
        const keyA = state.keyColA;
        const keyB = state.keyColB;

        const mapB = new Map();
        for(const row of state.b.rows){
          const k = normKey(row[keyB]);
          if(k === '') continue;
          if(!mapB.has(k)) mapB.set(k, []);
          mapB.get(k).push(row);
        }
        bar.style.width = '45%';

        const bOtherCols = state.b.headers.filter(h => h !== keyB);
        const amountCol = bOtherCols.find(h => h.includes('金額')) || null;
        const nameCol = bOtherCols.find(h => h.includes('名稱')) || bOtherCols.find(h => h.includes('編號')) || null;

        const resultRows = [];
        const detailRows = [];
        let hit = 0, miss = 0;

        for(const arow of state.a.rows){
          const k = normKey(arow[keyA]);
          const matches = k !== '' ? (mapB.get(k) || []) : [];
          const matched = matches.length > 0;
          if(matched) hit++; else miss++;

          const out = {};
          for(const h of state.a.headers){ out[h] = fmtCell(arow[h]); }
          out['是否比對成功'] = matched ? '是' : '否';
          out['比對筆數'] = matches.length;
          if(amountCol){
            out[amountCol+'_合計'] = matches.reduce((s,r)=> s + (Number(r[amountCol])||0), 0);
          }
          if(nameCol){
            out[nameCol+'_清單'] = matches.map(r => r[nameCol]).filter(Boolean).join('、');
          }
          resultRows.push(out);

          for(const m of matches){
            const drow = {};
            drow[keyA] = fmtCell(arow[keyA]);
            for(const h of bOtherCols){ drow[h] = fmtCell(m[h]); }
            detailRows.push(drow);
          }
        }

        bar.style.width = '85%';

        const resultHeaders = Object.keys(resultRows[0] || {});
        state.result = { headers: resultHeaders, rows: resultRows, detailRows, detailHeaders: Object.keys(detailRows[0]||{[keyA]:''}) };

        document.getElementById('stat-total').textContent = state.a.rows.length.toLocaleString();
        document.getElementById('stat-hit').textContent = hit.toLocaleString();
        document.getElementById('stat-miss').textContent = miss.toLocaleString();

        renderPreview(resultHeaders, resultRows.slice(0,15));

        document.getElementById('results-step').classList.add('show');
        bar.style.width = '100%';
        setStatus(`比對完成：共 ${state.a.rows.length.toLocaleString()} 筆，${hit.toLocaleString()} 筆比對成功（依「${keyA}」對「${keyB}」）。`);
        setTimeout(()=> progress.classList.remove('show'), 600);
      }catch(err){
        setStatus('比對失敗：'+err.message, true);
        progress.classList.remove('show');
      }
    }, 30);
  }

  function renderPreview(headers, rows){
    const table = document.getElementById('preview-table');
    let html = '<thead><tr>' + headers.map(h=>`<th>${h}</th>`).join('') + '</tr></thead><tbody>';
    for(const row of rows){
      html += '<tr>' + headers.map(h => {
        if(h === '是否比對成功'){
          const y = row[h] === '是';
          return `<td><span class="tag ${y?'y':'n'}">${row[h]}</span></td>`;
        }
        return `<td>${row[h] ?? ''}</td>`;
      }).join('') + '</tr>';
    }
    html += '</tbody>';
    table.innerHTML = html;
  }

  document.getElementById('run-btn').addEventListener('click', runMatch);

  document.getElementById('download-btn').addEventListener('click', () => {
    if(!state.result) return;
    const wb = XLSX.utils.book_new();
    const ws1 = XLSX.utils.json_to_sheet(state.result.rows, {header: state.result.headers});
    XLSX.utils.book_append_sheet(wb, ws1, '比對結果');
    if(state.result.detailRows.length){
      const ws2 = XLSX.utils.json_to_sheet(state.result.detailRows, {header: state.result.detailHeaders});
      XLSX.utils.book_append_sheet(wb, ws2, 'B表明細比對');
    }
    const ts = new Date();
    const pad = n => String(n).padStart(2,'0');
    const fname = `比對結果_${ts.getFullYear()}${pad(ts.getMonth()+1)}${pad(ts.getDate())}.xlsx`;
    XLSX.writeFile(wb, fname);
  });

})();
</script>
</body>
</html>
