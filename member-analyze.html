<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2027 會員健檢</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2230; --muted:#6b7385; --line:#e3e6ec;
  --accent:#2f5fd0; --accent-soft:#e8eefc; --side:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --panel:#1a1e25; --ink:#e8ebf0; --muted:#98a1b3; --line:#2a303a;
    --accent:#7aa2ff; --accent-soft:#1f2a45; --side:#161a20;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --panel:#1a1e25; --ink:#e8ebf0; --muted:#98a1b3; --line:#2a303a;
  --accent:#7aa2ff; --accent-soft:#1f2a45; --side:#161a20;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);height:auto}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.7}
a{color:var(--accent);text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.layout{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);
  border-right:1px solid var(--line);padding:24px 16px 32px}
.brand{font-weight:700;font-size:17px;padding:0 10px 18px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.grp{margin-top:14px}
.grp>a.g{display:block;padding:6px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.grp a.s{display:block;padding:6px 10px 6px 22px;border-radius:6px;font-size:14px;color:var(--ink)}
.grp a.s:hover{background:var(--accent-soft)}
.grp a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

main{padding:40px clamp(20px,5vw,64px) 96px;max-width:980px;width:100%}
.hero h1{margin:0 0 6px;font-size:28px;letter-spacing:.02em}
.hero p{margin:0 0 24px;color:var(--muted)}
table.idx{width:100%;border-collapse:collapse;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:14px}
.idx th,.idx td{padding:12px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.idx tr:last-child th,.idx tr:last-child td{border-bottom:0}
.idx th{width:110px;white-space:nowrap;background:var(--bg);font-weight:600}
.idx td a{display:inline-block;margin:0 14px 0 0}

.div{margin-top:64px}
.div>h2{margin:0 0 4px;font-size:22px;padding-bottom:10px;border-bottom:2px solid var(--accent)}
.div>p.lead{margin:8px 0 0;color:var(--muted);font-size:14px}
.cat{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px 28px}
.cat h3{margin:0 0 4px;font-size:18px}
.cat .path{font-size:13px;color:var(--muted);margin-bottom:16px}
.ph{border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted);font-size:14px}
.top{float:right;font-size:13px;color:var(--muted)}

:root{--pos:#1b7f4b;--neg:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pos:#5fcf94;--neg:#ff8a7a}}
:root[data-theme="dark"]{--pos:#5fcf94;--neg:#ff8a7a}
.p{color:var(--pos)}.n{color:var(--neg)}
.tw{overflow-x:auto;margin:12px 0}
table.dt{width:100%;min-width:640px;border-collapse:collapse;font-size:13px}
.dt th,.dt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.dt th{background:var(--bg);font-weight:600;white-space:nowrap}
.kpi{margin:0 0 16px;font-size:14px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pc>div{border:1px solid var(--line);border-radius:8px;padding:14px 18px}
.pc h4{margin:0 0 6px;font-size:14px}
.pc ul{margin:0;padding-left:18px;font-size:14px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.sub{margin:28px 0 0;font-size:15px}
@media (max-width:640px){.pc{grid-template-columns:1fr}}
.menu-btn{display:none}
@media (max-width:860px){
  .layout{display:block}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:20;transform:translateX(-100%);
    transition:transform .2s;padding-top:calc(env(safe-area-inset-top,0px) + 24px)}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  .menu-btn{display:block;position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;z-index:10;
    background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;font-size:14px}
  main{padding-top:72px}
  .idx th{width:84px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.side{transition:none}}
</style>

function mark(id){links.forEach(function(a){a.classList.remove("on")}); if(map[id])map[id].classList.add("on")}
if("IntersectionObserver" in window){
  var io=new IntersectionObserver(function(es){

  },{rootMargin:"-20% 0px -70% 0px"});
  [].forEach.call(document.querySelectorAll("article.cat"),function(el){io.observe(el)});
}
