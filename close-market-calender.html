<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作業流程公告版</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#232120;
    --ink-soft:#6b6560;
    --line:#bdbdbd;
    --paper:#f7f6f3;
    --card:#ffffff;
    --accent:#b5482e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    padding:24px 20px 50px;
  }
  .wrap{max-width:1500px;margin:0 auto;}
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:16px;
    border-bottom:2px solid var(--ink);
    padding-bottom:12px;
  }
  h1{font-size:20px;font-weight:700;margin:0 0 4px;}
  .subtitle{color:var(--ink-soft);font-size:12px;margin:0;}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .btn{
    border:1px solid var(--ink);
    background:var(--card);
    color:var(--ink);
    padding:7px 13px;
    font-size:13px;
    border-radius:3px;
    cursor:pointer;
    font-family:inherit;
  }
  .btn:hover{background:var(--ink);color:var(--paper);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:#8f3a24;}
  input[type=file]{display:none;}
  #status{font-size:12px;color:var(--ink-soft);}
  .monthnav{display:flex;align-items:center;gap:6px;margin-right:8px;}
  .monthlabel{font-size:14px;font-weight:700;min-width:64px;text-align:center;}

  .table-scroll{overflow-x:auto;border:1px solid var(--line);background:var(--card);}
  table{border-collapse:collapse;width:100%;min-width:1700px;table-layout:fixed;}
  th,td{border:1px solid var(--line);text-align:center;vertical-align:middle;}
  .titlecell{
    background:var(--ink);color:#fff;font-size:13px;font-weight:700;
    text-align:left;padding:6px 10px;white-space:nowrap;
  }
  .daycol{width:44px;min-width:44px;padding:3px 1px;}
  .daynum{font-size:12px;font-weight:700;}
  .weekday{font-size:10px;opacity:.7;}

  .lbl{
    font-size:11px;
    font-weight:600;
    padding:4px 6px;
    background:var(--card);
    white-space:pre-line;
    min-width:60px;
  }
  .lbl.group{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:2px;width:26px;min-width:26px;}
  .lbl.channel{width:78px;min-width:78px;font-size:10px;}
  .lbl.subtype{width:64px;min-width:64px;font-size:10px;}

  td.cell{
    font-size:10px;
    line-height:1.2;
    padding:2px 1px;
    height:28px;
    color:#232120;
    word-break:break-word;
  }

  .legend{margin-top:20px;padding-top:12px;border-top:1px solid var(--line);}
  .legend h2{font-size:12px;color:var(--ink-soft);margin:0 0 10px;font-weight:600;}
  .legend-items{display:flex;flex-wrap:wrap;gap:8px 14px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;}
  .swatch{width:14px;height:14px;border:1px solid var(--line);flex:none;}

  .rule-note{margin-top:14px;font-size:12px;color:var(--ink-soft);line-height:1.6;}
  .rule-note b{color:var(--ink);}

  @media (max-width:720px){header{flex-direction:column;align-items:flex-start;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="titleText">作業流程公告版</h1>
      <p class="subtitle">格式與色塊直接沿用「04.綜效資源表」原檔樣式</p>
    </div>
    <div class="controls">
      <div class="monthnav">
        <button class="btn" id="prevMonthBtn" title="上個月">◀</button>
        <span id="monthLabel" class="monthlabel"></span>
        <button class="btn" id="nextMonthBtn" title="下個月">▶</button>
        <button class="btn" id="resetMonthBtn">回到資料月份</button>
      </div>
      <input type="file" id="fileInput" accept=".xlsx">
      <button class="btn primary" id="uploadBtn">上傳下月 .xlsx 更新</button>
      <button class="btn" id="copyBtn">複製表格</button>
      <span id="status"></span>
    </div>
  </header>

  <div class="table-scroll">
    <table id="ganttTable"></table>
  </div>

  <div class="legend">
    <h2>線別色塊圖例（沿用原檔色碼）</h2>
    <div class="legend-items" id="legendItems"></div>
  </div>

  <p class="rule-note">
    <b>資料來源：</b>「04.綜效資源表」工作表，會員行銷區塊（EDM發送／APP推播／SMS發送，全會員｜公眾為淡色列，封閉為兩列供同日多檔期並列）。色塊顏色與文字直接取自原檔儲存格填色與內容，未另外重新配色。<br>
    重新上傳下個月同樣格式的檔期規劃 .xlsx 即可自動重繪（月份、天數會自動偵測）。
  </p>
</div>

<script>
const EMBEDDED = {"title": "【新首頁】作業流程公告版", "year": 2026, "month": 8, "numDays": 31, "rows": [{"row": 2, "group": "會員行銷", "channel": "EDM發送", "subtype": "全會員", "cells": {"5": {"text": "全站", "color": "#FFFF00"}, "6": {"text": "(其他單位)", "color": "#D9D9D9"}, "15": {"text": "(其他單位)", "color": "#D9D9D9"}, "31": {"text": "全站", "color": "#FFFF00"}}}, {"row": 3, "group": "會員行銷", "channel": "EDM發送", "subtype": "封閉", "cells": {"2": {"text": "童書", "color": "#FF99FF"}, "3": {"text": "(會員)", "color": "#EAD1DC"}, "4": {"text": "(其他單位)", "color": "#D9D9D9"}, "7": {"text": "全站", "color": "#FFFF00"}, "8": {"text": "(會員)", "color": "#EAD1DC"}, "9": {"text": "電子書", "color": "#CDF8CA"}, "10": {"text": "全站", "color": "#FFFF00"}, "12": {"text": "外文", "color": "#00FF00"}, "16": {"text": "全站", "color": "#FFFF00"}, "18": {"text": "文具", "color": "#FCD5B4"}, "19": {"text": "童書", "color": "#FF99FF"}, "20": {"text": "全站", "color": "#FFFF00"}, "21": {"text": "全站", "color": "#FFFF00"}, "23": {"text": "(會員)", "color": "#EAD1DC"}, "25": {"text": "全站", "color": "#FFFF00"}, "27": {"text": "外文", "color": "#00FF00"}, "30": {"text": "全站", "color": "#FFFF00"}}}, {"row": 4, "group": "會員行銷", "channel": "EDM發送", "subtype": "封閉", "cells": {}}, {"row": 5, "group": "會員行銷", "channel": "APP推播", "subtype": "公眾", "cells": {"1": {"text": "(會員)", "color": "#EAD1DC"}, "3": {"text": "(其他單位)", "color": "#D9D9D9"}, "4": {"text": "(其他單位)", "color": "#D9D9D9"}, "5": {"text": "全站", "color": "#FFFF00"}, "14": {"text": "全站", "color": "#FFFF00"}, "15": {"text": "(其他單位)", "color": "#D9D9D9"}, "22": {"text": "(其他單位)", "color": "#D9D9D9"}, "30": {"text": "全站", "color": "#FFFF00"}}}, {"row": 6, "group": "會員行銷", "channel": "APP推播", "subtype": "封閉", "cells": {"1": {"text": "全站", "color": "#FFFF00"}, "4": {"text": "全站", "color": "#FFFF00"}, "5": {"text": "(會員)", "color": "#EAD1DC"}, "6": {"text": "(會員)", "color": "#EAD1DC"}, "8": {"text": "全站", "color": "#FFFF00"}, "10": {"text": "全站", "color": "#FFFF00"}, "15": {"text": "全站", "color": "#FFFF00"}, "18": {"text": "文具", "color": "#FCD5B4"}, "20": {"text": "全站", "color": "#FFFF00"}, "21": {"text": "(會員)", "color": "#EAD1DC"}, "22": {"text": "全站", "color": "#FFFF00"}, "23": {"text": "全站", "color": "#FFFF00"}, "24": {"text": "(會員)", "color": "#EAD1DC"}, "25": {"text": "全站", "color": "#FFFF00"}, "26": {"text": "(會員)", "color": "#EAD1DC"}, "29": {"text": "全站", "color": "#FFFF00"}, "30": {"text": "全站", "color": "#FFFF00"}}}, {"row": 7, "group": "會員行銷", "channel": "APP推播", "subtype": "封閉", "cells": {"1": {"text": "美妝", "color": "#FF9900"}, "8": {"text": "美妝", "color": "#FF9900"}, "20": {"text": "美妝", "color": "#FF9900"}, "21": {"text": "美妝", "color": "#FF9900"}, "22": {"text": "美妝", "color": "#FF9900"}, "23": {"text": "美妝", "color": "#FF9900"}, "24": {"text": "美妝", "color": "#FF9900"}}}, {"row": 8, "group": "會員行銷", "channel": "SMS發送", "subtype": "", "cells": {"5": {"text": "全站", "color": "#FFFF00"}, "8": {"text": "文具", "color": "#FCD5B4"}, "14": {"text": "全站", "color": "#FFFF00"}, "16": {"text": "親子", "color": "#E6B8AF"}, "25": {"text": "全站", "color": "#FFFF00"}, "30": {"text": "全站", "color": "#FFFF00"}}}], "legend": {"全站": "#FFFF00", "中文": "#C4D79B", "電子書": "#CDF8CA", "3C": "#BF8F00", "文具": "#FCD5B4", "服飾": "#3D85C6", "美妝": "#FF9900", "食品": "#FFF5F5", "生活": "#FF6699", "童書": "#FF99FF", "休閒": "#6AA84F", "外文": "#00FF00", "親子": "#E6B8AF", "影音": "#C9DAF8", "IMC": "#674EA7", "(會員)": "#EAD1DC", "(其他單位)": "#D9D9D9"}};

let current = EMBEDDED;
current.dataYear = current.year;
current.dataMonth = current.month;
let viewYear = current.year;
let viewMonth = current.month;

function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function weekdayName(y,m,d){
  const names=['日','一','二','三','四','五','六'];
  return names[new Date(y,m-1,d).getDay()];
}
function isWeekend(y,m,d){
  const wd = new Date(y,m-1,d).getDay();
  return wd===0 || wd===6;
}

function computeSpans(rows, keyPath){
  // returns array same length as rows: {span, isTop} — span>0 means "render here with rowspan=span", 0 means "skip, covered by a previous rowspan"
  const res = [];
  for(let i=0;i<rows.length;i++){
    if(i>0 && sameChain(rows[i], rows[i-1], keyPath) ){
      res.push({span:0,isTop:false});
    } else {
      let span=1;
      for(let j=i+1;j<rows.length;j++){
        if(sameChain(rows[j], rows[i], keyPath)) span++; else break;
      }
      res.push({span, isTop:true});
    }
  }
  return res;
}
// "same chain" means all keys up to and including keyPath match the previous row
function sameChain(a,b,keyPath){
  for(const k of keyPath){ if(a[k]!==b[k]) return false; }
  return true;
}

function render(){
  const { rows, legend, title, dataYear, dataMonth } = current;
  const y = viewYear, m = viewMonth;
  const numDays = daysInMonth(y, m);
  const isDataMonth = (y === dataYear && m === dataMonth);

  document.getElementById('titleText').textContent = title || '作業流程公告版';
  document.getElementById('monthLabel').textContent = `${y}/${m}`;
  document.getElementById('resetMonthBtn').style.visibility = isDataMonth ? 'hidden' : 'visible';

  const table = document.getElementById('ganttTable');
  table.innerHTML = '';

  const groupSpans = computeSpans(rows, ['group']);
  const channelSpans = computeSpans(rows, ['group','channel']);
  const subtypeSpans = computeSpans(rows, ['group','channel','subtype']);

  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  const corner = document.createElement('th');
  corner.className='titlecell';
  corner.colSpan = 3;
  corner.textContent = `${y}/${m}` + (isDataMonth ? '' : '（僅預覽日期，無檔期資料）');
  headRow.appendChild(corner);
  for(let d=1; d<=numDays; d++){
    const th = document.createElement('th');
    th.className='daycol';
    th.style.background = isWeekend(y,m,d) ? '#f4cccc' : '#e0f7fa';
    th.innerHTML = `<div class="daynum">${d}</div><div class="weekday">${weekdayName(y,m,d)}</div>`;
    headRow.appendChild(th);
  }
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  const usedLabels = new Set();

  rows.forEach((row, i) => {
    const tr = document.createElement('tr');

    if(groupSpans[i].isTop){
      const td = document.createElement('td');
      td.className='lbl group';
      td.rowSpan = groupSpans[i].span;
      td.textContent = row.group;
      tr.appendChild(td);
    }
    if(channelSpans[i].isTop){
      const td = document.createElement('td');
      td.className='lbl channel';
      td.rowSpan = channelSpans[i].span;
      td.textContent = row.channel;
      tr.appendChild(td);
    }
    if(subtypeSpans[i].isTop){
      const td = document.createElement('td');
      td.className='lbl subtype';
      td.rowSpan = subtypeSpans[i].span;
      td.textContent = row.subtype || '';
      tr.appendChild(td);
    }

    for(let d=1; d<=numDays; d++){
      const td = document.createElement('td');
      td.className='cell';
      const c = isDataMonth ? row.cells[String(d)] : null;
      if(c){
        td.style.background = c.color || '#ffffff';
        td.textContent = c.text;
        td.title = c.text;
        usedLabels.add(JSON.stringify([c.text, c.color]));
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  const legendWrap = document.getElementById('legendItems');
  legendWrap.innerHTML = '';
  const legendEntries = legend ? Object.entries(legend) : [];
  legendEntries.forEach(([label,color]) => {
    const item = document.createElement('div');
    item.className='legend-item';
    item.innerHTML = `<span class="swatch" style="background:${color||'#fff'}"></span>${label}`;
    legendWrap.appendChild(item);
  });
}

document.getElementById('prevMonthBtn').addEventListener('click', () => {
  viewMonth -= 1;
  if(viewMonth < 1){ viewMonth = 12; viewYear -= 1; }
  render();
});
document.getElementById('nextMonthBtn').addEventListener('click', () => {
  viewMonth += 1;
  if(viewMonth > 12){ viewMonth = 1; viewYear += 1; }
  render();
});
document.getElementById('resetMonthBtn').addEventListener('click', () => {
  viewYear = current.dataYear;
  viewMonth = current.dataMonth;
  render();
});

// ---- Parsing an uploaded workbook of the same template ----
function colLetterToIdx(){} // unused placeholder

function findMergeTopLeft(merges, r, c){
  for(const mc of merges){
    // mc format: {s:{r,c}, e:{r,c}} 0-indexed from SheetJS
    if(mc.s.r<=r && r<=mc.e.r && mc.s.c<=c && c<=mc.e.c){
      return {r:mc.s.r, c:mc.s.c};
    }
  }
  return {r,c};
}
function cellVal(ws, r, c){
  const addr = XLSX.utils.encode_cell({r,c});
  const cell = ws[addr];
  return cell ? cell.v : undefined;
}
function cellColor(ws, r, c){
  const addr = XLSX.utils.encode_cell({r,c});
  const cell = ws[addr];
  if(cell && cell.s && cell.s.fgColor && cell.s.fgColor.rgb){
    return '#' + cell.s.fgColor.rgb.slice(-6);
  }
  return null;
}

function parseTemplate(wb){
  const sheetName = wb.SheetNames.find(n => n.includes('綜效資源')) || wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const range = XLSX.utils.decode_range(ws['!ref']);
  const merges = ws['!merges'] || [];

  // date columns from row 0 (row1 in 1-indexed)
  const dateCols = [];
  for(let c=6; c<=range.e.c; c++){
    const v = cellVal(ws, 0, c);
    if(v instanceof Date){
      dateCols.push({c, day: v.getDate()});
    } else if (dateCols.length) {
      break;
    }
  }
  if(!dateCols.length) throw new Error('找不到日期欄');
  const firstDate = new Date(cellVal(ws,0,dateCols[0].c));
  const year = firstDate.getFullYear(), month = firstDate.getMonth()+1;

  // find the row where col A (0) has the group label (e.g. 會員行銷) — first non-empty after row 0
  let groupRow = -1;
  for(let r=1; r<=range.e.r; r++){
    const v = cellVal(ws, r, 0);
    if(v){ groupRow = r; break; }
  }
  if(groupRow === -1) throw new Error('找不到分區標籤（如「會員行銷」）');

  // Walk downward from groupRow while column A's merge-resolved value stays the same,
  // OR any of columns A-D / date columns have content — stop at first fully blank row.
  const rowsOut = [];
  let r = groupRow;
  while (r <= range.e.r) {
    const hasLabel = [0,2,3].some(c => cellVal(ws, r, c) !== undefined);
    const hasDay = dateCols.some(({c}) => cellVal(ws, r, c) !== undefined);
    if(!hasLabel && !hasDay){
      // allow one blank row (rare) then stop
      break;
    }
    const gTL = findMergeTopLeft(merges, r, 0);
    const cTL = findMergeTopLeft(merges, r, 2);
    const sTL = findMergeTopLeft(merges, r, 3);
    const group = cellVal(ws, gTL.r, gTL.c) || '';
    const channel = cellVal(ws, cTL.r, cTL.c) || '';
    const subtype = cellVal(ws, sTL.r, sTL.c) || '';
    const cells = {};
    dateCols.forEach(({c, day}) => {
      const v = cellVal(ws, r, c);
      if(v !== undefined && String(v).trim() !== ''){
        cells[String(day)] = { text: String(v).trim(), color: cellColor(ws, r, c) };
      }
    });
    rowsOut.push({group, channel, subtype, cells});
    r++;
  }

  // legend: scan rows after the data block for a row with several short, colored, distinct cells
  let legend = {};
  for(let lr = r+1; lr <= Math.min(r+15, range.e.r); lr++){
    let hits = 0;
    const found = {};
    dateCols.forEach(({c}) => {
      const v = cellVal(ws, lr, c);
      const col = cellColor(ws, lr, c);
      if(v && String(v).trim() && col){
        found[String(v).trim()] = col;
        hits++;
      }
    });
    if(hits >= 5){ legend = found; break; }
  }

  return {
    title: cellVal(ws,0,0) || '作業流程公告版',
    year, month,
    numDays: daysInMonth(year, month),
    rows: rowsOut,
    legend
  };
}

document.getElementById('uploadBtn').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const status = document.getElementById('status');
  status.textContent = '解析中…';
  const reader = new FileReader();
  reader.onload = (evt) => {
    try{
      const wb = XLSX.read(evt.target.result, {type:'array', cellStyles:true});
      current = parseTemplate(wb);
      current.dataYear = current.year;
      current.dataMonth = current.month;
      viewYear = current.year;
      viewMonth = current.month;
      render();
      status.textContent = `已更新：${current.year}/${current.month}`;
    }catch(err){
      status.textContent = '解析失敗：' + err.message;
    }
  };
  reader.readAsArrayBuffer(file);
});

document.getElementById('copyBtn').addEventListener('click', async () => {
  const table = document.getElementById('ganttTable');
  const status = document.getElementById('status');
  try{
    const html = table.outerHTML;
    const blobHtml = new Blob([html], {type:'text/html'});
    const blobText = new Blob([table.innerText], {type:'text/plain'});
    await navigator.clipboard.write([new ClipboardItem({'text/html': blobHtml, 'text/plain': blobText})]);
    status.textContent = '已複製表格，可直接貼到 Excel／Word';
  }catch(err){
    status.textContent = '複製失敗，請手動選取表格複製';
  }
});

render();
</script>
</body>
</html>
