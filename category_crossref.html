<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品類共購比對工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1c2430;
    --ink-soft:#4a5568;
    --paper:#f6f4ef;
    --panel:#ffffff;
    --line:#dcd7cb;
    --navy:#1f3a5f;
    --navy-deep:#152a45;
    --amber:#c17a34;
    --amber-soft:#f2e3d0;
    --teal:#2f6b63;
    --teal-soft:#e1efec;
    --danger:#a8422f;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
    padding:32px 20px 80px;
  }
  .wrap{max-width:1120px;margin:0 auto;}
  header.page{margin-bottom:28px;}
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--amber);
    font-weight:700;
    margin-bottom:6px;
  }
  h1{
    font-size:26px;
    margin:0 0 6px;
    letter-spacing:-.01em;
    color:var(--navy-deep);
  }
  .sub{color:var(--ink-soft);font-size:14px;max-width:640px;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px 24px;
    margin-bottom:20px;
  }
  .card h2{
    font-size:14px;
    margin:0 0 14px;
    color:var(--navy);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .step-num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:20px;height:20px;
    background:var(--navy);
    color:#fff;
    border-radius:50%;
    font-size:11px;
    font-family:var(--mono);
    flex:none;
  }

  /* upload */
  .drop{
    border:1.5px dashed var(--line);
    border-radius:8px;
    padding:26px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .drop:hover, .drop.drag{border-color:var(--amber); background:var(--amber-soft);}
  .drop input{display:none;}
  .drop .big{font-size:14px;color:var(--ink);font-weight:600;margin-bottom:4px;}
  .filemeta{
    margin-top:12px;
    font-family:var(--mono);
    font-size:12px;
    color:var(--teal);
    display:none;
  }

  /* mapping */
  .map-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 24px;
  }
  .map-row{display:flex; flex-direction:column; gap:5px;}
  .map-row label{
    font-size:12px; color:var(--ink-soft); font-weight:600;
  }
  .req{color:var(--danger); font-weight:700;}
  select, .cat-select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:13px;
    background:#fff;
    color:var(--ink);
    font-family:var(--sans);
  }
  .catcols{
    grid-column:1 / -1;
    border-top:1px dashed var(--line);
    padding-top:14px;
    margin-top:4px;
  }
  .catcols .hint{font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    border:1px solid var(--line);
    border-radius:20px;
    padding:6px 13px;
    font-size:12.5px;
    cursor:pointer;
    background:#fff;
    color:var(--ink-soft);
    user-select:none;
  }
  .chip.on{
    background:var(--navy);
    border-color:var(--navy);
    color:#fff;
  }

  button.primary{
    margin-top:18px;
    background:var(--navy);
    color:#fff;
    border:none;
    padding:11px 20px;
    border-radius:7px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    font-family:var(--sans);
  }
  button.primary:hover{background:var(--navy-deep);}
  button.primary:disabled{background:#b9c0cb; cursor:not-allowed;}

  button.secondary{
    background:#fff;
    color:var(--navy);
    border:1.4px solid var(--navy);
    padding:8px 15px;
    border-radius:7px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    font-family:var(--sans);
  }
  button.secondary:hover{background:var(--teal-soft); border-color:var(--teal); color:var(--teal);}

  /* analysis controls */
  .ctrl-row{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    align-items:flex-end;
  }
  .ctrl-item{display:flex;flex-direction:column;gap:5px;min-width:220px;flex:1;}
  .ctrl-item label{font-size:12px;color:var(--ink-soft);font-weight:600;}

  /* summary */
  .summary-strip{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    margin:18px 0 22px;
  }
  .stat{
    background:#fff;
    padding:14px 16px;
  }
  .stat .label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
  .stat .val{font-family:var(--mono); font-size:20px; font-weight:700; color:var(--navy-deep);}

  table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  thead th{
    text-align:right;
    background:var(--navy);
    color:#fff;
    padding:10px 12px;
    font-weight:600;
    font-size:12px;
    white-space:nowrap;
  }
  thead th:first-child, thead th:nth-child(2){text-align:left;}
  tbody td{
    padding:9px 12px;
    border-bottom:1px solid var(--line);
    text-align:right;
    font-family:var(--mono);
    white-space:nowrap;
  }
  tbody td:first-child, tbody td:nth-child(2){
    text-align:left;
    font-family:var(--sans);
  }
  tbody tr:hover{background:var(--teal-soft);}
  tbody tr.self-row{background:var(--amber-soft);}
  tbody tr.self-row td{font-weight:700;}
  .barcell{position:relative;}
  .bar{
    position:absolute; left:0; top:0; bottom:0;
    background:var(--teal-soft);
    z-index:0;
  }
  .bar-label{position:relative; z-index:1;}

  .badge{
    display:inline-block;
    font-family:var(--mono);
    font-size:10.5px;
    padding:2px 7px;
    border-radius:4px;
    background:var(--teal-soft);
    color:var(--teal);
    font-weight:700;
    margin-left:6px;
  }
  .empty-note{
    color:var(--ink-soft);
    font-size:13px;
    padding:14px 0;
  }
  .hidden{display:none !important;}
  .col-note{
    font-size:11.5px; color:var(--ink-soft); margin-top:6px;
  }
  .footer-note{
    font-size:12px; color:var(--ink-soft); margin-top:26px; border-top:1px solid var(--line); padding-top:14px;
  }
  select#catValue{font-weight:700;}
</style>
</head>
<body>
<div class="wrap">

  <header class="page">
    <div class="eyebrow">品類共購交叉分析</div>
    <h1>品類共購比對工具</h1>
    <div class="sub">上傳含「母訂單號碼」與「品類/商品」欄位的訂單明細，選定一個品類後，即可看出這些訂單裡還同時出現哪些其他品類、各自的訂單數、占比、銷售金額與購買數量。</div>
  </header>

  <!-- Step 1: Upload -->
  <div class="card" id="step1">
    <h2><span class="step-num">1</span>上傳訂單明細（CSV / Excel）</h2>
    <label class="drop" id="dropZone">
      <div class="big">點擊選擇檔案，或拖曳檔案到這裡</div>
      <div>支援 .csv / .xlsx / .xls，欄位順序不限，下一步再對應欄位</div>
      <input type="file" id="fileInput" accept=".csv,.xlsx,.xls">
    </label>
    <div class="filemeta" id="fileMeta"></div>
  </div>

  <!-- Step 2: Mapping -->
  <div class="card hidden" id="step2">
    <h2><span class="step-num">2</span>對應欄位</h2>
    <div class="map-grid">
      <div class="map-row">
        <label>母訂單號碼 <span class="req">必填</span></label>
        <select id="colOrder"></select>
      </div>
      <div class="map-row">
        <label>銷售金額（該列品項金額）</label>
        <select id="colAmount"></select>
      </div>
      <div class="map-row">
        <label>購買數量（該列品項數量）</label>
        <select id="colQty"></select>
      </div>
      <div class="map-row">
        <label>商品名稱（選填，供對照用）</label>
        <select id="colProduct"></select>
      </div>

      <div class="catcols">
        <div class="hint">勾選你資料裡有的「品類欄位」（可複選，之後分析時再挑一個層級來用，例如 類別1-2 / 類別2 / 類別3 / 26碼）：</div>
        <div class="chips" id="catChips"></div>
      </div>
    </div>
    <button class="primary" id="btnConfirmMap">確認欄位，進入分析</button>
  </div>

  <!-- Step 3: Analysis -->
  <div class="card hidden" id="step3">
    <h2><span class="step-num">3</span>選擇分析品類與條件</h2>
    <div class="ctrl-row">
      <div class="ctrl-item">
        <label>品類欄位（層級）</label>
        <select id="catLevel"></select>
      </div>
      <div class="ctrl-item">
        <label>指定品類（篩選訂單依據）</label>
        <select id="catValue"></select>
      </div>
      <div class="ctrl-item">
        <label>結果排序</label>
        <select id="sortBy">
          <option value="orders">依訂單數排序</option>
          <option value="amount">依銷售金額排序</option>
          <option value="qty">依購買數量排序</option>
        </select>
      </div>
    </div>
    <div class="col-note" id="mapRecap"></div>
  </div>

  <!-- Results -->
  <div class="card hidden" id="resultCard">
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
      <h2 style="margin:0;">比對結果</h2>
      <div style="display:flex; gap:8px;">
        <button class="secondary" id="btnExportCsv">匯出 CSV</button>
        <button class="secondary" id="btnExportXlsx">匯出 Excel</button>
      </div>
    </div>
    <div class="summary-strip" id="summaryStrip"></div>
    <div id="tableWrap"></div>
    <div class="footer-note">
      平均訂單價＝該共購品類之銷售金額 ÷ 該共購品類之訂單數（即這批訂單中，該品類本身貢獻的平均金額，非整張母訂單總額）。若「母訂單號碼」重複出現於同一品類多列，會先去重後計算訂單數。
    </div>
  </div>

</div>

<script>
let rawRows = [];
let headers = [];
let mapping = { order:null, amount:null, qty:null, product:null, catCols:[] };
let lastResult = { targetVal:null, level:null, baseOrderCount:0, rows:[] };

const $ = (id) => document.getElementById(id);

// ---------- File handling ----------
const dropZone = $('dropZone');
const fileInput = $('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});

function handleFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(!json.length){ alert('讀不到資料，請確認檔案內容。'); return; }
      rawRows = json;
      headers = Object.keys(json[0]);
      $('fileMeta').style.display = 'block';
      $('fileMeta').textContent = `已載入「${file.name}」，共 ${rawRows.length} 列，${headers.length} 個欄位`;
      buildMappingUI();
      $('step2').classList.remove('hidden');
    }catch(err){
      alert('檔案解析失敗：' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

// ---------- Mapping UI ----------
function buildMappingUI(){
  const selects = ['colOrder','colAmount','colQty','colProduct'];
  selects.forEach(id => {
    const sel = $(id);
    sel.innerHTML = '';
    if(id !== 'colOrder'){
      const optNone = document.createElement('option');
      optNone.value = ''; optNone.textContent = '（不使用）';
      sel.appendChild(optNone);
    }
    headers.forEach(h => {
      const opt = document.createElement('option');
      opt.value = h; opt.textContent = h;
      sel.appendChild(opt);
    });
  });
  // sensible auto-guess
  guessSelect('colOrder', ['母訂單', '訂單號', '訂單編號']);
  guessSelect('colAmount', ['銷售金額', '金額', '售金']);
  guessSelect('colQty', ['數量', '銷售數量', '購買數量']);
  guessSelect('colProduct', ['商品名稱', '品名']);

  const chipsWrap = $('catChips');
  chipsWrap.innerHTML = '';
  headers.forEach(h => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = h;
    chip.dataset.col = h;
    const looksLikeCat = /類別|品類|26碼|分類/.test(h);
    if(looksLikeCat) chip.classList.add('on');
    chip.addEventListener('click', () => chip.classList.toggle('on'));
    chipsWrap.appendChild(chip);
  });
}

function guessSelect(id, keywords){
  const sel = $(id);
  for(const h of headers){
    if(keywords.some(k => h.includes(k))){
      sel.value = h;
      return;
    }
  }
}

$('btnConfirmMap').addEventListener('click', () => {
  mapping.order = $('colOrder').value;
  mapping.amount = $('colAmount').value || null;
  mapping.qty = $('colQty').value || null;
  mapping.product = $('colProduct').value || null;
  mapping.catCols = Array.from(document.querySelectorAll('#catChips .chip.on')).map(c => c.dataset.col);

  if(!mapping.order){ alert('請選擇母訂單號碼欄位'); return; }
  if(mapping.catCols.length === 0){ alert('請至少勾選一個品類欄位'); return; }

  $('mapRecap').textContent =
    `目前對應：母訂單號碼＝${mapping.order}` +
    (mapping.amount ? `｜銷售金額＝${mapping.amount}` : '') +
    (mapping.qty ? `｜購買數量＝${mapping.qty}` : '') +
    `｜品類欄位＝${mapping.catCols.join('、')}`;

  buildAnalysisUI();
  $('step3').classList.remove('hidden');
  $('resultCard').classList.add('hidden');
});

// ---------- Analysis UI ----------
function buildAnalysisUI(){
  const levelSel = $('catLevel');
  levelSel.innerHTML = '';
  mapping.catCols.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    levelSel.appendChild(opt);
  });
  levelSel.addEventListener('change', populateCatValues);
  $('catValue').addEventListener('change', runAnalysis);
  $('sortBy').addEventListener('change', runAnalysis);
  populateCatValues();
}

function populateCatValues(){
  const level = $('catLevel').value;
  const valSel = $('catValue');
  valSel.innerHTML = '';
  const counts = {};
  rawRows.forEach(r => {
    const v = (r[level] ?? '').toString().trim();
    if(v === '') return;
    counts[v] = (counts[v]||0) + 1;
  });
  const vals = Object.keys(counts).sort((a,b) => counts[b]-counts[a]);
  vals.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = `${v}（${counts[v]}列）`;
    valSel.appendChild(opt);
  });
  runAnalysis();
}

// ---------- Core cross-reference logic ----------
function runAnalysis(){
  const level = $('catLevel').value;
  const targetVal = $('catValue').value;
  const sortBy = $('sortBy').value;
  if(!level || !targetVal){ return; }

  // 1. find the set of order IDs that contain targetVal in `level`
  const targetOrderIds = new Set();
  rawRows.forEach(r => {
    const v = (r[level] ?? '').toString().trim();
    const oid = (r[mapping.order] ?? '').toString().trim();
    if(v === targetVal && oid !== '') targetOrderIds.add(oid);
  });

  const baseOrderCount = targetOrderIds.size;

  // 2. among rows belonging to those orders, aggregate by category value in `level`
  const agg = {}; // catVal -> {orderSet:Set, amount, qty}
  rawRows.forEach(r => {
    const oid = (r[mapping.order] ?? '').toString().trim();
    if(!targetOrderIds.has(oid)) return;
    const v = (r[level] ?? '').toString().trim();
    if(v === '') return;
    if(!agg[v]) agg[v] = { orderSet:new Set(), amount:0, qty:0 };
    agg[v].orderSet.add(oid);
    if(mapping.amount){
      const amt = parseFloat(r[mapping.amount]);
      if(!isNaN(amt)) agg[v].amount += amt;
    }
    if(mapping.qty){
      const q = parseFloat(r[mapping.qty]);
      if(!isNaN(q)) agg[v].qty += q;
    }
  });

  let rows = Object.keys(agg).map(v => {
    const a = agg[v];
    const orders = a.orderSet.size;
    return {
      cat: v,
      isSelf: v === targetVal,
      orders,
      pct: baseOrderCount ? (orders / baseOrderCount * 100) : 0,
      amount: a.amount,
      qty: a.qty,
      avgOrderPrice: orders ? (a.amount / orders) : 0
    };
  });

  if(sortBy === 'orders') rows.sort((a,b) => b.orders - a.orders);
  else if(sortBy === 'amount') rows.sort((a,b) => b.amount - a.amount);
  else rows.sort((a,b) => b.qty - a.qty);

  // self row pinned to top
  rows.sort((a,b) => (b.isSelf - a.isSelf));

  renderResults(targetVal, level, baseOrderCount, rows);
}

function renderResults(targetVal, level, baseOrderCount, rows){
  $('resultCard').classList.remove('hidden');
  lastResult = { targetVal, level, baseOrderCount, rows };

  const totalAmount = rows.reduce((s,r)=>s + (r.isSelf ? r.amount : 0), 0);
  const otherCatCount = rows.filter(r => !r.isSelf).length;

  $('summaryStrip').innerHTML = `
    <div class="stat"><div class="label">篩選品類</div><div class="val" style="font-size:16px;">${escapeHtml(targetVal)}</div></div>
    <div class="stat"><div class="label">符合訂單數（母訂單）</div><div class="val">${baseOrderCount.toLocaleString()}</div></div>
    <div class="stat"><div class="label">同時出現的其他品類數</div><div class="val">${otherCatCount}</div></div>
    <div class="stat"><div class="label">品類欄位</div><div class="val" style="font-size:14px;">${escapeHtml(level)}</div></div>
  `;

  const maxOrders = Math.max(...rows.map(r=>r.orders), 1);

  let html = `<table><thead><tr>
    <th>品類</th><th>說明</th><th>訂單數</th><th>占比</th>
    ${mapping.amount ? '<th>銷售金額</th>' : ''}
    ${mapping.qty ? '<th>購買數量</th>' : ''}
    ${mapping.amount ? '<th>平均訂單價</th>' : ''}
  </tr></thead><tbody>`;

  rows.forEach(r => {
    const barPct = (r.orders / maxOrders * 100).toFixed(1);
    html += `<tr class="${r.isSelf ? 'self-row' : ''}">
      <td>${escapeHtml(r.cat)}</td>
      <td>${r.isSelf ? '<span class="badge">篩選品類本身</span>' : '共同出現'}</td>
      <td class="barcell"><div class="bar" style="width:${barPct}%"></div><span class="bar-label">${r.orders.toLocaleString()}</span></td>
      <td>${r.pct.toFixed(1)}%</td>
      ${mapping.amount ? `<td>${Math.round(r.amount).toLocaleString()}</td>` : ''}
      ${mapping.qty ? `<td>${r.qty.toLocaleString()}</td>` : ''}
      ${mapping.amount ? `<td>${Math.round(r.avgOrderPrice).toLocaleString()}</td>` : ''}
    </tr>`;
  });

  html += '</tbody></table>';
  if(rows.length === 0){
    html = `<div class="empty-note">找不到符合的訂單，請確認篩選的品類值是否正確。</div>`;
  }
  $('tableWrap').innerHTML = html;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- Export ----------
function buildExportRows(){
  return lastResult.rows.map(r => {
    const row = {
      '共購品類': r.cat,
      '說明': r.isSelf ? '篩選品類本身' : '共同出現',
      '訂單數': r.orders,
      '占比(%)': Number(r.pct.toFixed(1)),
    };
    if(mapping.amount) row['銷售金額'] = Math.round(r.amount);
    if(mapping.qty) row['購買數量'] = r.qty;
    if(mapping.amount) row['平均訂單價'] = Math.round(r.avgOrderPrice);
    return row;
  });
}

function exportFileName(ext){
  const safeVal = (lastResult.targetVal || 'result').replace(/[\\/:*?"<>|]/g, '_');
  return `品類共購分析_${safeVal}.${ext}`;
}

$('btnExportCsv').addEventListener('click', () => {
  if(!lastResult.rows.length){ alert('目前沒有可匯出的結果'); return; }
  const rows = buildExportRows();
  const cols = Object.keys(rows[0]);
  const lines = [cols.join(',')];
  rows.forEach(r => {
    lines.push(cols.map(c => {
      const v = r[c] === undefined || r[c] === null ? '' : String(r[c]);
      return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v;
    }).join(','));
  });
  // BOM for Excel 中文相容
  const blob = new Blob(['\uFEFF' + lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = exportFileName('csv');
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

$('btnExportXlsx').addEventListener('click', () => {
  if(!lastResult.rows.length){ alert('目前沒有可匯出的結果'); return; }
  const rows = buildExportRows();
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '共購分析');
  XLSX.writeFile(wb, exportFileName('xlsx'));
});
</script>
</body>
